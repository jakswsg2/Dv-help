services:
  postgres:
    image: postgres:16-alpine
    container_name: dv_prep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dvprep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dvprep_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dvprep_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvprep_user -d dvprep_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dv_prep_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password_2026}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: dv_prep_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dvprep_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dvprep_minio_secret_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dv_prep_backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dvprep_user}:${POSTGRES_PASSWORD:-dvprep_secure_password_2026}@postgres:5432/${POSTGRES_DB:-dvprep_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password_2026}@redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dvprep_minio_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dvprep_minio_secret_2026}
      S3_BUCKET_NAME: dvprep-documents
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super_secret_jwt_key_dv_prep_2026_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - backend_net
      - frontend_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dv_prep_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info -c 4
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dvprep_user}:${POSTGRES_PASSWORD:-dvprep_secure_password_2026}@postgres:5432/${POSTGRES_DB:-dvprep_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_password_2026}@redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dvprep_minio_admin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dvprep_minio_secret_2026}
      S3_BUCKET_NAME: dvprep-documents
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dv_prep_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - frontend_net

  nginx:
    image: nginx:alpine
    container_name: dv_prep_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
