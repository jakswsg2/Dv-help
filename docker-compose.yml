# ==============================================================================
# DV-Prep — Docker Compose (Local / Development)
# ==============================================================================
# The application is a self-contained Vite + React SPA that talks directly to
# Firebase (Firestore / Auth) from the browser. Therefore the stack is a single
# service: a static build served by Nginx inside the container.
#
#   docker compose up --build
#   → http://localhost:8080
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dv-prep:local
    container_name: dv_prep_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
