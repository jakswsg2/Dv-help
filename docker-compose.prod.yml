# ==============================================================================
# DV-Prep — Docker Compose (Production)
# ==============================================================================
# The application is a self-contained Vite + React SPA served as static files.
# Firebase (Firestore / Auth) is accessed directly from the visitor's browser,
# so no backend, database, or object-storage containers are required.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#   → http://localhost:${APP_PORT:-8080}
#
# Put this behind a reverse proxy (Nginx / Caddy / Traefik) with TLS for
# public exposure; the container itself only speaks plain HTTP on port 80.
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-dv-prep}:${TAG:-latest}
    container_name: dv_prep_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
