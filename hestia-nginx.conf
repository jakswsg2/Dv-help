# ==============================================================================
# HestiaCP Nginx Reverse Proxy Template for DV-Help / DV-Prep Application
# (Native Node.js Frontend + Backend API Routing)
# ==============================================================================
# Usage in HestiaCP:
# 1. Place this file (or copy the blocks) into:
#    - /usr/local/hestia/data/templates/web/nginx/dv-help.tpl   (for HTTP)
#    - /usr/local/hestia/data/templates/web/nginx/dv-help.stpl  (for HTTPS / SSL)
# 2. Or include directly in domain conf:
#    - /home/%user%/conf/web/%domain%/nginx.conf_dvhelp
# 3. Apply via Hestia CLI or Web UI:
#    v-change-web-domain-tpl <user> <domain> dv-help
#    v-restart-web
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Upstream Definitions for Local Processes
# ------------------------------------------------------------------------------
upstream dvhelp_frontend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream dvhelp_api_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 2. HTTP Server Block (Port 80 / %web_port%)
# ------------------------------------------------------------------------------
server {
    listen      %ip%:%web_port%;
    server_name %domain_idn% %alias_idn%;
    root        %docroot%;
    index       index.html index.htm;
    
    access_log  /var/log/nginx/domains/%domain%.log combined;
    access_log  /var/log/nginx/domains/%domain%.bytes bytes;
    error_log   /var/log/nginx/domains/%domain%.error.log error;

    # Maximum upload size for passport scans, DV photos, and batch zip archives
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Compression settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # API Backend Proxy (/api/) -> FastAPI / Python / Express on 127.0.0.1:8000
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://dvhelp_api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket / Keepalive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for heavy tasks (AI photo enhancement, MRZ OCR extraction, batch validation)
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Buffering configuration
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # --------------------------------------------------------------------------
    # OpenAPI Interactive Docs & Schema (/docs, /redoc, /openapi.json)
    # --------------------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://dvhelp_api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Direct Static Uploads Directory (Local Hestia Filesystem)
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias %home%/%user%/web/%domain%/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Static Assets Cache Control (_next/static, assets, images)
    # --------------------------------------------------------------------------
    location ~* ^/(assets|_next/static)/.*\.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        proxy_pass http://dvhelp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # Frontend Single Page / Node.js App Proxy (Root Route) -> 127.0.0.1:3000
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://dvhelp_frontend;
        proxy_http_version 1.1;

        # WebSocket support for HMR, real-time sync & notifications
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Let's Encrypt ACME Challenge verification
    location ~ /\.well-known/acme-challenge/ {
        root %docroot%;
        allow all;
    }

    # Custom domain-level include files
    include %home%/%user%/conf/web/%domain%/nginx.conf_*;
}

# ------------------------------------------------------------------------------
# 3. HTTPS / SSL Server Block (Port 443 / %web_ssl_port%)
# ------------------------------------------------------------------------------
server {
    listen      %ip%:%web_ssl_port% ssl http2;
    server_name %domain_idn% %alias_idn%;
    root        %docroot%;
    index       index.html index.htm;

    access_log  /var/log/nginx/domains/%domain%.log combined;
    access_log  /var/log/nginx/domains/%domain%.bytes bytes;
    error_log   /var/log/nginx/domains/%domain%.error.log error;

    # SSL Certificates managed by HestiaCP & Let's Encrypt
    ssl_certificate      %ssl_pem%;
    ssl_certificate_key  %ssl_key%;
    ssl_status           on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload and buffer limits
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Compression settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # SSL API Backend Proxy (/api/) -> 127.0.0.1:8000
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://dvhelp_api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Ssl on;

        # WebSocket / Keepalive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for heavy processing (AI validation, photo cropping, batch processing)
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Buffering configuration
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # --------------------------------------------------------------------------
    # SSL API Documentation & Schema (/docs, /redoc, /openapi.json)
    # --------------------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://dvhelp_api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # SSL Direct Static Uploads Directory
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias %home%/%user%/web/%domain%/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # SSL Static Assets Cache Control
    # --------------------------------------------------------------------------
    location ~* ^/(assets|_next/static)/.*\.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        proxy_pass http://dvhelp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # SSL Frontend Node.js App Proxy -> 127.0.0.1:3000
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://dvhelp_frontend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Ssl on;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }

    # Custom domain-level include files
    include %home%/%user%/conf/web/%domain%/nginx.conf_*;
}
